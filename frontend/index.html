<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./arango-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arango Resource Manager</title>
    <!-- Applies the saved or OS colour scheme before first paint (theme-toggle.tsx). -->
    <script>
      (function(){try{var t=localStorage.getItem("arango-theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.classList.toggle("dark",t==="dark")}catch(e){}})()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
